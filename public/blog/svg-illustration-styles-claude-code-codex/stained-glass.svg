 <feGaussianBlur in="mott" stdDeviation="4" result="glow"/>
 <feComponentTransfer in="glow" result="glow2"><feFuncA type="linear" slope="0.35"/></feComponentTransfer>
 <feBlend in="mott" in2="glow2" mode="screen"/>
 <feComponentTransfer><feFuncR type="gamma" exponent="0.8"/><feFuncG type="gamma" exponent="0.8"/><feFuncB type="gamma" exponent="0.8"/></feComponentTransfer>
</filter>
<filter id="lead" x="-3%" y="-3%" width="106%" height="106%" color-interpolation-filters="sRGB">
