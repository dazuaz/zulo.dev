<ellipse cx="184" cy="281" rx="20" ry="5"/><ellipse cx="404" cy="284" rx="16" ry="4"/><ellipse cx="76" cy="288" rx="14" ry="3.5"/><ellipse cx="534" cy="288" rx="13" ry="3.5"/>
</g>
