<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 336" role="img" aria-labelledby="title desc">
<title id="title">A hypothetical block, one unit per storey</title>
<desc id="desc">An Isotype elevation with invented storey counts of three, five, four and two, built from identical repeated floor units. Only the four-storey focus building is vermilion. Four shallow separate lots, three identical round trees and a pale frontage road complete the hypothetical South Florida scene.</desc>
<style>svg { --paper:#F3EBD7; --lot:#E0E3CF; --building:#6F877A; --tree:#284D3D; --focus:#DE6343; } .buildings {color:var(--building)} .focus {color:var(--focus)}</style>
