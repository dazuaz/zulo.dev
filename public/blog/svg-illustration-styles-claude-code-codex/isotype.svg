<symbol id="lot" viewBox="0 0 96 32"><path fill="var(--lot)" d="M0 0h96v32H0z"/><path fill="var(--paper)" d="M40 0h16v32H40z"/></symbol>
<symbol id="tree" viewBox="0 0 24 32"><path fill="var(--tree)" d="M10 20h4v12h-4z"/><circle fill="var(--tree)" cx="12" cy="12" r="12"/></symbol>
<symbol id="road" viewBox="0 0 56 16"><path fill="var(--lot)" d="M0 0h56v16H0z"/><path fill="var(--paper)" d="M16 6h24v4H16z"/></symbol>
</defs>
