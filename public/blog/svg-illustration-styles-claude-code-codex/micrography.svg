    <path id="window-1" d="M12 10H44"/>
    <path id="window-2" d="M52 10H84"/>
    <path id="window-3" d="M108 10H140"/>
    <path id="window-4" d="M148 10H180"/>
    <path id="front-left-row" d="M12 0H82"/>
    <path id="front-right-row" d="M110 0H180"/>
    <path id="front-left-base" d="M12 34H82"/>
    <path id="front-right-base" d="M110 34H180"/>
    <path id="front-upright" d="M0 26V10"/>
    <path id="door-left" d="M88 31V17"/>
    <path id="door-right" d="M104 31V17"/>
    <path id="door-lintel" d="M90 14H102"/>
    <path id="side-row" d="M10 0H86"/>
    <path id="side-base" d="M10 34H86"/>
    <path id="side-upright" d="M96 26V10"/>
