<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 336" role="img" aria-labelledby="title desc">
  <title id="title">A hypothetical South Florida block built from type</title>
  <desc id="desc">A dark three-plane focus building with word windows and an open word-framed entrance stands on its own lot. Two lighter three-plane neighboring buildings, three spiral-text canopies, and a word-built frontage road complete the block.</desc>
  <style>
    svg { --paper:#f3efe3; --ink:#284138; --teal:#1d7973; --ochre:#ac733e; }
    text { font-family:ui-monospace,monospace; fill:var(--ink); }
    .roof-fill { font-size:5px; font-weight:600; }
    .wall-fill { font-size:5px; font-weight:600; }
    .roof-edge { font-size:6.8px; font-weight:700; }
    .wall-base { font-size:6.4px; font-weight:700; }
    .upright { font-size:3.8px; font-weight:500; }
    .lintel { font-size:3px; font-weight:500; }
    .terrace { font-size:4.3px; fill:var(--ochre); }
    .neighbor-fill { font-size:3.7px; font-weight:400; }
    .neighbor-edge { font-size:4.6px; font-weight:400; }
    .lot { font-size:5.5px; fill:var(--ochre); opacity:.75; }
    .canopy { font-size:5px; fill:var(--teal); }
    .road-fill { font-size:4.8px; fill:var(--teal); }
    .road-edge { font-size:7px; fill:var(--teal); }
  </style>
