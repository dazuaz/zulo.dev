    <path id="roof-left-row" d="M12 0H62"/>
    <path id="roof-right-row" d="M130 0H180"/>
    <path id="roof-top" d="M12 0H180"/>
    <path id="roof-bottom" d="M12 96H180"/>
    <path id="roof-left" d="M0 84V12"/>
    <path id="roof-right" d="M192 84V12"/>
    <path id="terrace-top" d="M76 30H116"/>
    <path id="terrace-bottom" d="M76 66H116"/>
    <path id="terrace-left" d="M70 60V36"/>
    <path id="terrace-right" d="M122 60V36"/>
